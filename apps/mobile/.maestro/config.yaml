# Maestro workspace config for the FoundKeep Android app.
# Run:  maestro test .maestro --env GOOGLE_ACCOUNT=you@gmail.com
# The appId in each flow is app.foundkeep.android (prod/friends build). For a dev
# build with a different package, override per flow or search-replace the appId.
flows:
  - "*.yaml"
executionOrder:
  continueOnFailure: true
