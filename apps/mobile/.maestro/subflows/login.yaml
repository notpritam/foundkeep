appId: app.foundkeep.android
---
# Reusable sign-in. Sign-in is Apple or Google only (no email), so this signs in
# with Google: the device must already have a Google account on it; supply
# --env GOOGLE_ACCOUNT=you@gmail.com to pick it in Google's account chooser.
# Selectors come from apps/mobile/src/sign-in/FirstScreen.tsx.
- tapOn: "Continue with Google"
- tapOn:
    text: ${GOOGLE_ACCOUNT}
    optional: true
- assertVisible:
    id: "collection-header"
    timeout: 45000
