<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Atlas — Capture</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div id="view-main">
      <header class="popup-head">
        <a class="brand" href="#" id="brandLibrary" aria-label="Atlas library"
          ><img src="../assets/mark.svg" alt="" />Atlas</a
        ><span class="storage"><i></i>Saved in this browser</span>
      </header>
      <main class="popup-main">
        <div class="intro">
          <h1>Found something good?</h1>
          <p>Keep it close.</p>
        </div>
        <div class="current-page">
          <span class="page-icon" data-icon="bookmark"></span>
          <div>
            <span id="page-domain">Current page</span>
            <p id="page-title">Choose what to keep.</p>
          </div>
        </div>
        <div
          class="capture-actions"
          role="group"
          aria-label="Capture from this page"
        >
          <button data-act="region">
            <span data-icon="screenshot"></span>Region</button
          ><button data-act="fullpage">
            <span data-icon="image"></span>Full page</button
          ><button data-act="highlight">
            <span data-icon="highlight"></span>Highlight</button
          ><button data-act="savepage">
            <span data-icon="bookmark"></span>Save link
          </button>
        </div>
        <p id="captureFeedback" class="fine" role="status">
          Right-click an image or a selection to save it, too.
        </p>
        <div class="composer">
          <label for="note">Or, keep a thought.</label
          ><textarea
            id="note"
            rows="2"
            maxlength="100000"
            placeholder="What’s worth remembering?"
          ></textarea>
          <div class="composer-foot">
            <span class="fine">⌘ / Ctrl + Enter to save</span
            ><button id="save" class="btn primary" disabled>
              Save note <span data-icon="arrow"></span>
            </button>
          </div>
          <p id="saveFeedback" class="statusline" role="status"></p>
        </div>
        <section class="recent-section" aria-labelledby="recentHeading">
          <div class="section-heading">
            <h2 id="recentHeading">Just collected</h2>
            <span id="savedCount"></span>
          </div>
          <ul id="recent"></ul>
        </section>
      </main>
      <footer class="popup-foot">
        <button id="openLib" class="library-link">
          Open library <span data-icon="arrow"></span></button
        ><button id="openSettings" class="iconbtn" aria-label="Settings">
          <span data-icon="settings"></span>
        </button>
      </footer>
    </div>
    <div id="view-settings" hidden>
      <header class="popup-head">
        <button id="backBtn" class="iconbtn" aria-label="Back to capture">
          <span class="back-arrow" data-icon="arrow"></span>
        </button>
        <h2>Settings</h2>
      </header>
      <div class="settings-panel" id="connections"></div>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
