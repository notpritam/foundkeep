<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FoundKeep — Add details</title>
<link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="review.css">
<script src="theme.js" type="module"></script></head>
<body>
<!-- The details card: opened from the dock's "Saved · Add details" widget to
     edit a save that has already happened. It edits only the save the
     background granted it (capture-details.js). Layout (approved design,
     design-system Storybook "Extension / Add details card"): the title, a
     boxless note, one row of folder and tag pills, then My library, Share and
     Save on one line. Nothing sits above the title. -->
<form id="detailsForm" class="card" data-ready="false" novalidate>
  <div class="title-row">
    <input id="detailsTitle" class="title" maxlength="1000" placeholder="Add a title" aria-label="Title" disabled>
    <button id="detailsCancel" type="button" class="icon-button" aria-label="Close without saving" data-tip="Close"></button>
  </div>
  <textarea id="detailsNote" class="note" rows="2" maxlength="50000" placeholder="Add a note" aria-label="Personal note" disabled></textarea>
  <div class="pills">
    <button id="detailsFolder" type="button" class="pill" aria-haspopup="listbox" aria-expanded="false" disabled></button>
    <span id="detailsTags" class="chips" aria-label="Personal tags"></span>
    <button id="detailsAddTag" type="button" class="pill ghost" aria-haspopup="listbox" aria-expanded="false" disabled></button>
  </div>
  <div id="detailsShare" class="share-line" hidden>
    <span id="detailsShareIcon" aria-hidden="true"></span>
    <textarea id="sharedBody" class="note" rows="1" maxlength="5000" placeholder="Add a caption for the collection" aria-label="Caption for the collection"></textarea>
  </div>
  <p id="detailsFeedback" class="statusline" role="status"></p>
  <footer class="foot">
    <span class="pill static" id="detailsLibrary" data-tip="Saved to My library"></span>
    <button id="detailsCollection" type="button" class="pill ghost" aria-haspopup="listbox" aria-expanded="false" disabled></button>
    <button id="detailsReload" type="button" class="text-button" hidden>Retry</button>
    <span class="spacer"></span>
    <button id="detailsSave" type="submit" class="primary" disabled>Save details</button>
  </footer>
</form>
<script src="review.js" type="module"></script>
</body></html>
