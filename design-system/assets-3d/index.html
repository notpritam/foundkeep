<!doctype html>
<meta charset="utf-8">
<title>FoundKeep 3D objects</title>
<script type="importmap">{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }</script>
<script type="module">
// Studio for FoundKeep's 3D objects (objects.js). render.mjs calls
// window.renderObject(name, size) and saves the transparent image it returns.
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { OBJECTS } from './objects.js';

const RENDER = 1024;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(RENDER, RENDER);
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.NeutralToneMapping; renderer.toneMappingExposure = 1.0;
renderer.setClearColor(0x000000, 0);
const environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;

window.renderObject = async (name, size = 480) => {
  const { group, pose } = await OBJECTS[name]();
  const scene = new THREE.Scene(); scene.environment = environment; scene.environmentIntensity = 1.15;
  const key = new THREE.DirectionalLight('#ffffff', 2.1); key.position.set(3, 5, 7); scene.add(key);
  const rim = new THREE.DirectionalLight('#cfe8ff', 0.6); rim.position.set(-5, 2, -3); scene.add(rim);
  scene.add(new THREE.HemisphereLight('#ffffff', '#9fb0c2', 0.5));
  group.rotation.set(pose[0], pose[1], pose[2]); scene.add(group);
  // Centre the object and fit the camera to it, with a little room around.
  const bounds = new THREE.Box3().setFromObject(group), centre = bounds.getCenter(new THREE.Vector3()), extent = bounds.getSize(new THREE.Vector3());
  group.position.sub(centre);
  // Frame the object tightly: its larger side fills the image, with a small margin.
  const camera = new THREE.PerspectiveCamera(26, 1, 0.1, 100), distance = (Math.max(extent.x, extent.y) / 2) / Math.tan(THREE.MathUtils.degToRad(13)) * 1.1 + extent.z / 2;
  camera.position.set(0, 0, distance); camera.lookAt(0, 0, 0);
  renderer.render(scene, camera);
  // Downscale for smooth edges, keep transparency.
  const out = document.createElement('canvas'); out.width = out.height = size;
  const ctx = out.getContext('2d'); ctx.imageSmoothingQuality = 'high'; ctx.drawImage(renderer.domElement, 0, 0, size, size);
  return out.toDataURL('image/webp', 0.9);
};
window.ready = true;
</script>
